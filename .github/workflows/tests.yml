name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pester:
    name: Pester (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows, PowerShell 7
            os: windows-latest
            shell: pwsh
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
          - name: macOS, PowerShell 7
            os: macos-latest
            shell: pwsh
          - name: Ubuntu, PowerShell 7
            os: ubuntu-latest
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester 5
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Module -Name Pester -ListAvailable | Where-Object Version -ge '5.5.0')) {
            Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $PSVersionTable.PSVersion.ToString()
          (Get-Module -Name Pester -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version.ToString()

      - name: Run tests
        run: ./tests/Invoke-Tests.ps1 -OutputFile testResults.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shell }}
          path: testResults.xml
          if-no-files-found: ignore

  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        run: |
          if (-not (Get-Module -Name PSScriptAnalyzer -ListAvailable)) {
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }

      - name: Analyze
        run: |
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -Property Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap
          if ($findings) { throw "$(@($findings).Count) PSScriptAnalyzer error(s)" }
